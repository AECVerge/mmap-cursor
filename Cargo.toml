[package]
name = "mmap-cursor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A zero-copy byte-position reader for parsers and lexers of large files"
license = "MIT OR Apache-2.0"
keywords = ["mmap", "large-file", "byte-position", "parser", "cursor"]
categories = ["filesystem", "memory-management", "parsing"]
repository = "https://github.com/AECVerge/mmap-cursor"
exclude = ["/.github", "/AGENTS.md"]

[dependencies]
memchr = { version = "2", optional = true }
memmap2 = "0.9"
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = ["simd"]
# "serde" enables `Serialize` on the position types (`BytePos`, `ByteRange`).
# It is opt-in so a consumer that never serializes positions doesn't pull in
# serde at all.
serde = ["dep:serde"]
# "simd" uses memchr for a SIMD-accelerated newline scan when building the line
# index. Without it (e.g. --no-default-features), an equivalent byte-scanning
# fallback is used, so the behaviour (and the line_index public API) is
# identical either way.
simd = ["dep:memchr"]

[dev-dependencies]
